 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            background: #111;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.5);
        }

        #gameUI {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 0 0 5px #00f, 0 0 10px #00f;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 0 0 10px #f00, 0 0 20px #f00;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            background: rgba(0, 100, 255, 0.7);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restartBtn:hover {
            background: rgba(0, 150, 255, 0.9);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="gameUI">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <div id="gameOver">
        GAME OVER<br>
        <span id="finalScore">Score: 0</span><br>
        <button id="restartBtn">Play Again</button>
    </div>

    <script>
        // Game Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // Game State
        let score = 0;
        let lives = 3;
        let gameRunning = true;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 50,
            height: 50,
            speed: 5,
            color: '#00a8ff',
            lasers: [],
            lastShot: 0,
            shootDelay: 300,
            draw() {
                // Ship body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.height / 2);
                ctx.lineTo(this.x + this.width / 2, this.y + this.height / 2);
                ctx.lineTo(this.x - this.width / 2, this.y + this.height / 2);
                ctx.closePath();
                ctx.fill();

                // Thruster effect
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.moveTo(this.x - 15, this.y + this.height / 2);
                ctx.lineTo(this.x + 15, this.y + this.height / 2);
                ctx.lineTo(this.x, this.y + this.height / 2 + 20);
                ctx.closePath();
                ctx.fill();

                // Thruster particles
                if (Math.random() > 0.7) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(
                        this.x - 5 + Math.random() * 10,
                        this.y + this.height / 2 + 10,
                        2 + Math.random() * 3,
                        5 + Math.random() * 10
                    );
                }
            },
            shoot() {
                const now = Date.now();
                if (now - this.lastShot > this.shootDelay) {
                    this.lasers.push({
                        x: this.x,
                        y: this.y - this.height / 2,
                        width: 3,
                        height: 15,
                        speed: 10,
                        color: '#00f7ff'
                    });
                    this.lastShot = now;
                }
            },
            update() {
                // Laser updates
                this.lasers.forEach((laser, index) => {
                    laser.y -= laser.speed;
                    if (laser.y < 0) {
                        this.lasers.splice(index, 1);
                    }
                });
            }
        };

        // Enemies
        const enemies = [];
        const enemyColors = ['#e74c3c', '#9b59b6', '#3498db', '#2ecc71', '#f1c40f'];

        function spawnEnemy() {
            const size = 30 + Math.random() * 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speedX: Math.random() * 2 - 1,
                speedY: 1 + Math.random() * 2,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
                health: Math.floor(size / 10)
            });
        }

        // Explosions
        const explosions = [];

        function createExplosion(x, y, color) {
            const particles = [];
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x,
                    y,
                    size: 2 + Math.random() * 3,
                    speedX: Math.random() * 6 - 3,
                    speedY: Math.random() * 6 - 3,
                    color,
                    life: 30 + Math.random() * 20,
                    opacity: 1
                });
            }
            explosions.push(particles);
        }

        // Game Controls
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            a: false,
            d: false,
            w: false,
            s: false,
            ' ': false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === ' ' && gameRunning) player.shoot();
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Game Loop
        let lastTime = 0;
        let enemySpawnTimer = 0;

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            if (Math.random() > 0.9) {
                ctx.fillStyle = 'white';
                ctx.fillRect(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    1 + Math.random() * 2,
                    1 + Math.random() * 2
                );
            }

            if (gameRunning) {
                // Player movement
                if ((keys.ArrowLeft || keys.a) && player.x > player.width / 2) {
                    player.x -= player.speed;
                }
                if ((keys.ArrowRight || keys.d) && player.x < canvas.width - player.width / 2) {
                    player.x += player.speed;
                }
                if ((keys.ArrowUp || keys.w) && player.y > player.height / 2) {
                    player.y -= player.speed;
                }
                if ((keys.ArrowDown || keys.s) && player.y < canvas.height - player.height / 2) {
                    player.y += player.speed;
                }

                // Spawn enemies
                enemySpawnTimer += deltaTime;
                if (enemySpawnTimer > 1000) {
                    spawnEnemy();
                    enemySpawnTimer = 0;
                }

                // Update player and lasers
                player.update();

                // Update enemies
                enemies.forEach((enemy, enemyIndex) => {
                    enemy.x += enemy.speedX;
                    enemy.y += enemy.speedY;

                    // Bounce off walls
                    if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                        enemy.speedX *= -1;
                    }

                    // Check if enemy hit player
                    if (
                        player.x - player.width / 2 < enemy.x + enemy.width &&
                        player.x + player.width / 2 > enemy.x &&
                        player.y - player.height / 2 < enemy.y + enemy.height &&
                        player.y + player.height / 2 > enemy.y
                    ) {
                        lives--;
                        livesElement.textContent = lives;
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                        enemies.splice(enemyIndex, 1);

                        if (lives <= 0) {
                            gameOver();
                        }
                    }

                    // Check if enemy reached bottom
                    if (enemy.y > canvas.height) {
                        enemies.splice(enemyIndex, 1);
                    }

                    // Check laser hits
                    player.lasers.forEach((laser, laserIndex) => {
                        if (
                            laser.x < enemy.x + enemy.width &&
                            laser.x + laser.width > enemy.x &&
                            laser.y < enemy.y + enemy.height &&
                            laser.y + laser.height > enemy.y
                        ) {
                            enemy.health--;
                            player.lasers.splice(laserIndex, 1);

                            // Hit effect
                            ctx.fillStyle = 'white';
                            ctx.fillRect(enemy.x + enemy.width / 2 - 5, enemy.y + enemy.height / 2 - 5, 10, 10);

                            if (enemy.health <= 0) {
                                score += Math.floor(enemy.width / 5);
                                scoreElement.textContent = score;
                                createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                                enemies.splice(enemyIndex, 1);
                            }
                        }
                    });
                });

                // Draw lasers
                player.lasers.forEach(laser => {
                    ctx.fillStyle = laser.color;
                    ctx.fillRect(laser.x - laser.width / 2, laser.y, laser.width, laser.height);
                });

                // Draw enemies
                enemies.forEach(enemy => {
                    ctx.fillStyle = enemy.color;
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                });
            }

            // Draw explosions
            explosions.forEach((explosion, index) => {
                explosion.forEach(particle => {
                    ctx.fillStyle = `rgba(${hexToRgb(particle.color)}, ${particle.opacity})`;
                    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);

                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    particle.life--;
                    particle.opacity = particle.life / 50;
                });

                if (explosion[0].life <= 0) {
                    explosions.splice(index, 1);
                }
            });

            // Draw player
            player.draw();

            // Continue game loop
            requestAnimationFrame(gameLoop);
        }

        // Helper functions
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = `Score: ${score}`;
            gameOverElement.style.display = 'block';
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameRunning = true;
            player.lasers = [];
            enemies.length = 0;
            explosions.length = 0;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            gameOverElement.style.display = 'none';
        }

        // Event listeners
        restartBtn.addEventListener('click', resetGame);

        // Start game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
